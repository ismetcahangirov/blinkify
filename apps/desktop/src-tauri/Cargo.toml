[package]
name = "blinkify-desktop"
description = "The Blinkify Tauri shell. Thin: window, commands, events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Tauri 2 builds the application as a library so the mobile targets and the
# desktop binary share one entry point.
name = "blinkify_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
blinkify-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.11.6", features = [] }
# Native open and save dialogs (#54, #53): the webview cannot give a file's
# full path, and a project or a source is a path. Official Tauri plugin,
# Apache-2.0 OR MIT; it brings rfd (MIT) and tauri-plugin-fs (Apache-2.0 OR MIT).
tauri-plugin-dialog = "2.7.3"
# CLAUDE.md section 20 rule 8 permits exactly one outbound request: the update
# check. This plugin is it, and it verifies a minisign signature on the manifest
# before anything is downloaded.
tauri-plugin-updater = "2.9.0"
# The update offer crosses the IPC boundary, so its TypeScript type is generated
# from the Rust definition rather than written twice.
ts-rs = { workspace = true }

[dev-dependencies]
# The signature gate is the whole security model of auto-update, so it is tested
# rather than assumed. `minisign` signs a throwaway payload in the test and
# `minisign-verify` is the verifier Tauri itself uses; neither needs the
# production private key, which is why this test can exist at all.
minisign = "0.7.9"
minisign-verify = "0.2.4"
# Tauri stores the public key base64-encoded around the minisign file format,
# so the test has to undo that before it can parse the key.
base64 = "0.22.1"
serde_json = { workspace = true }

[lints]
workspace = true
