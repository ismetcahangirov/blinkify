# ts-rs writes the generated IPC contract here when `cargo test` runs, so the
# Rust types stay the single source of truth and the TypeScript side is never
# hand-maintained. CLAUDE.md section 2.
#
# `relative = true` resolves against the workspace root, so this works the same
# from any directory and needs no cross-platform env-var shim in a script.
[env]
TS_RS_EXPORT_DIR = { value = "packages/types/src/generated", relative = true }
