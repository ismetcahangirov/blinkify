[package]
name = "blinkify-engine"
description = "The Blinkify media engine. Must not depend on Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Audio output through the operating system's low-latency path — WASAPI on
# Windows (#28). Audio is the playback clock, so this is what every preview
# frame is timed against. Apache-2.0, RustAudio, released monthly. No default
# features: no ASIO, JACK or PulseAudio.
cpal = "0.18.2"
serde = { workspace = true }
# `float_roundtrip`: a gain or a loudness target in the project file (#32)
# must read back as the same double, or a save of an unchanged project
# changes bytes. The default parser can be one ULP off.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# SHA-256 for the content key of on-disk caches (#24). RustCrypto; already in
# the tree through Tauri, so this adds no new package to what ships.
sha2 = "0.10.9"
thiserror = { workspace = true }
ts-rs = { workspace = true }

# One Windows job object with kill-on-close, so no ffmpeg.exe survives
# Blinkify — even an unclean exit (#22). A safe wrapper over a stable Win32
# API; the workspace forbids `unsafe` in our own code, so the FFI lives here.
# MIT OR Apache-2.0. Last commit 2025-06: the job-object API it wraps has not
# changed since Windows 8, so it is finished rather than abandoned.
[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"
# The version of every display adapter's driver, read from the registry, as
# part of the key of the cached encoder capability profile (#83): a new driver
# can add or remove what a hardware encoder does. Microsoft's `windows-rs`,
# MIT OR Apache-2.0, released with it. Already in the tree through the
# updater's `reqwest`, so this adds no new package to what ships.
windows-registry = "0.6.1"

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
