# The pull-request gate.
#
# Every check here blocks a merge. CLAUDE.md section 20 rule 10: no merging with
# a red gate, and no disabling a gate to go green.
#
# Windows only, and first, deliberately. Blinkify targets Windows; a Linux
# pipeline would go green while the product was broken for every user — and the
# traps that cost real time here (the MSVC linker, the NSIS bundler, WebView2)
# are all Windows traps that a Linux runner cannot see.
#
# This workflow holds the 15-minute budget in CLAUDE.md section 13. The
# losslessness suite and the timeline benchmark do not fit inside it and live in
# `heavy.yml`, which blocks a release rather than a merge.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run proves nothing about the commit that replaced it, and it
# holds a runner the new one needs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # cargo-deny ships no lockfile entry, so it is pinned here and cached on this
  # key. Bumping it is a deliberate edit, not a silent `latest`.
  CARGO_DENY_VERSION: "0.20.2"
  # Colour codes in a log file are noise, and `-D warnings` output is read.
  CARGO_TERM_COLOR: never

jobs:
  format:
    name: Format (Prettier)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm format:check

  lint:
    name: Lint (ESLint)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint

      # The colour gate rides in this job rather than its own so the set of
      # required status checks on `main` does not move. It is a lint rule in
      # everything but implementation: ESLint cannot read the `.css` files where
      # two thirds of an interface's colours live, so the rule is a scanner.
      - name: No colour outside the token file (#15)
        run: pnpm colours:check

      # Before the gate above is believed. A colour gate that has never been
      # seen to reject anything is indistinguishable from one that does not
      # work — CLAUDE.md section 14.
      - name: That gate still catches one (colours:check:test)
        run: pnpm colours:check:test

      # Same job, same reasoning: a scanner where ESLint cannot see. Blinkify
      # must render on a machine with no network, so nothing the interface
      # needs before first paint may come off one.
      - name: No remote asset reference (#16)
        run: pnpm offline:check

      - name: That gate still catches one (offline:check:test)
        run: pnpm offline:check:test

      # And the third scanner: no hard-coded length, duration or font weight
      # inside the design system. Epic #2's acceptance criterion is that no
      # component contains a hard-coded colour, radius, duration or spacing
      # value; the colour gate covers the first, this covers the rest.
      - name: No hard-coded value in packages/ui (#17)
        run: pnpm tokens:check

      - name: That gate still catches one (tokens:check:test)
        run: pnpm tokens:check:test

      # The icons are generated from two committed SVGs. This fails if the
      # rasters were edited by hand or the mark changed without them being
      # regenerated — #20 requires the generation to be reproducible, and a
      # reproducibility claim nobody checks is a claim.
      - name: Icons match the source artwork (#20)
        run: pnpm icons:check

  typecheck:
    name: Typecheck (tsc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      # `turbo run typecheck` depends on `^build`, so the workspace packages are
      # built as a side effect and the renderer bundle is proved to compile.
      - run: pnpm typecheck
      - run: pnpm build

  test-typescript:
    name: Test (Vitest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm test:ts

  version:
    name: Version consistency
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      # Five files carry the version across two package managers. The failure
      # this catches is not a wrong number in a file — it is an installed build
      # whose version disagrees with the release manifest, so the updater
      # concludes there is nothing to do and the user never gets the fix.
      - run: pnpm version:check

  docs-links:
    name: Docs links
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm check:links

  project-graph:
    name: Project graph
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm

      - name: Boundaries (graph:validate)
        run: pnpm graph:validate

      # #30: the shared evaluator is the only code that interprets the edit
      # graph. The compiler keeps other Rust modules from reading a clip's
      # operations; this keeps them, and the renderer, from taking an
      # Operation apart by hand.
      - name: Evaluator boundary (evaluator:check)
        run: pnpm evaluator:check

      - name: Evaluator boundary fires (evaluator:check:test)
        run: pnpm evaluator:check:test

      # #37: every change to the open graph is an edit on the history. The
      # compiler keeps the shell out of the document; this keeps other Rust
      # code from building graph changes by hand, and renderer components
      # from sending edits around the project store.
      - name: Edit boundary (edits:check)
        run: pnpm edits:check

      - name: Edit boundary fires (edits:check:test)
        run: pnpm edits:check:test

      # Runs before graph:check, on purpose. If a rule has been disarmed, the
      # committed graph is a faithful record of a check that proves nothing, and
      # graph:check would go green on it. Better to fail on the disarmed rule
      # than on its consequence.
      - name: Every rule still fires (graph:injection)
        run: pnpm graph:injection

      - name: Generator is deterministic (graph:determinism)
        run: pnpm graph:determinism

      # Last: determinism has to hold before a diff can mean "the tree moved".
      - name: Committed graph is current (graph:check)
        run: pnpm graph:check

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          target-cache: debug
      # Tauri will not compile the shell crate without its externalBins, and
      # the engine's integration tests run the real sidecar.
      - uses: ./.github/actions/fetch-sidecar
      # The engine's integration tests read real media, generated from
      # committed recipes rather than committed as binaries.
      - uses: ./.github/actions/corpus

      - name: Format (cargo fmt)
        run: cargo fmt --all --check

      # `-D warnings` or it is advisory, and an advisory clippy is an ignored
      # clippy. Several workspace lints — indexing_slicing, unwrap_used,
      # cast_possible_truncation — exist because a length that came out of a
      # media file must never reach an index or a cast unchecked.
      - name: Lint (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # CLAUDE.md section 13: the engine must test with no Tauri present. This
      # job installs no WebView2 and opens no window, so that property is
      # exercised rather than asserted.
      - name: Test (cargo test)
        run: cargo test --workspace

      # #32: the TypeScript contract cannot drift from the Rust types. The
      # tests just compiled, so regenerating into a scratch directory costs
      # seconds; node is on the runner already (fetch-sidecar uses it).
      - name: IPC contract is current (types:check)
        run: node tools/types-gate.mjs

  boundaries:
    name: Boundaries and licences (Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      # No target cache: everything in this job reads `cargo metadata` and
      # compiles nothing.
      - uses: ./.github/actions/setup-rust

      - name: Restore cargo-deny
        id: deny-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny.exe
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version ${{ env.CARGO_DENY_VERSION }}

      - name: No engine crate reaches Tauri
        run: pnpm boundaries:rust

      - name: That check still catches one (boundaries:rust:test)
        run: pnpm boundaries:rust:test

      - name: No GPL, AGPL or LGPL crate
        run: pnpm deny:licenses

      - name: That gate still rejects one (deny:test)
        run: pnpm deny:test

      # #73: the notices the installer ships name every crate and renderer
      # package in the tree. A dependency added without regenerating ships
      # unattributed and nothing else would notice. Texts come from the
      # registry sources `cargo metadata` has just unpacked and from
      # node_modules; the tool makes no request of its own.
      - name: Third-party notices are current (attribution:check)
        run: pnpm attribution:check

      - name: That gate still catches a new dependency (attribution:injection)
        run: pnpm attribution:injection

      - name: The notices are deterministic (attribution:determinism)
        run: pnpm attribution:determinism

      - name: Every crate is covered, or generation fails (attribution:coverage)
        run: pnpm attribution:coverage

      # ADR-0002's first gate, #21: the bundled binary is asked what it is.
      # No GPL configuration, no software H.264 or HEVC encoder, the committed
      # configure line exactly, every encoder and filter Epics #6 and #7 need,
      # and hashes that match the recorded provenance.
      - uses: ./.github/actions/fetch-sidecar
      - name: The FFmpeg sidecar is LGPL-only and complete
        run: pnpm sidecar:check

      - name: That gate still rejects a GPL build (sidecar:check:test)
        run: pnpm sidecar:check:test

  installer:
    name: Installer (tauri build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-rust
        with:
          target-cache: release
      - uses: ./.github/actions/fetch-sidecar

      - name: Build the NSIS installer
        run: pnpm tauri build

      # #21: "the installer carries both binaries and they run from the
      # installed location". Install silently, per-user as a user would, and
      # run the installed copies — not the ones in the source tree. The runner
      # has its own FFmpeg on PATH, which is the point: the one that answers
      # must be ours.
      - name: The installed sidecar runs
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Blinkify'
          foreach ($name in 'ffmpeg', 'ffprobe') {
            $exe = Join-Path $dir "$name.exe"
            if (-not (Test-Path $exe)) { throw "$exe was not installed" }
            $version = & $exe -hide_banner -version | Select-Object -First 1
            if ($version -notmatch 'blinkify') { throw "$exe is not the Blinkify build: $version" }
            Write-Output "$name installed and runs: $version"
          }

      # #73: the notices the application shows under Help are a file the
      # installer put beside it — and exactly the committed one.
      - name: The installed third-party notices are the committed ones
        shell: pwsh
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Blinkify/THIRD-PARTY-NOTICES.txt'
          if (-not (Test-Path $installed)) { throw "$installed was not installed" }
          $expected = (Get-FileHash apps/desktop/src-tauri/THIRD-PARTY-NOTICES.txt).Hash
          $actual = (Get-FileHash $installed).Hash
          if ($actual -ne $expected) { throw "installed notices differ from the committed document" }
          Write-Output "THIRD-PARTY-NOTICES.txt installed, $((Get-Item $installed).Length) bytes, matches the committed document"

      # Uploaded on every run so a reviewer can install the pull request rather
      # than take a green tick on faith. The installer is unsigned — see #14 and
      # the SmartScreen gap recorded in Epic #1.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: blinkify-installer-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/Blinkify.exe
          if-no-files-found: error
          retention-days: 14
