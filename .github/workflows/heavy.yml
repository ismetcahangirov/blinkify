# The release gate.
#
# These suites block a **release**, not a merge. CLAUDE.md section 13: the
# pull-request gate has a 15-minute budget, and a full `pnpm tauri build` plus
# clippy, `cargo test` and Vitest already fills it. Generating a media corpus,
# hashing packet payloads across it, and running a frame-rate benchmark on top
# would not fit — and a pipeline that routinely overruns gets bypassed, which
# costs more than the suites are worth.
#
# So they run here: weekly, on demand, and on a release tag.
#
# ────────────────────────────────────────────────────────────────────────────
# THIS IS NOT YET A GATE. Both suites belong to Epics that have not started:
#
#   * the losslessness suite and its media corpus — Epic #6, issue #45
#   * the timeline frame-rate benchmark          — Epic #5, issue #33
#
# Until those land, the jobs below report that they are absent and say so in the
# run summary. They are deliberately written now, empty, because the shape of
# the split — what blocks a merge versus what blocks a release — is a decision
# from Epic #1 (#13) and belongs in the repository where the next person will
# find it, not in an issue comment.
#
# A job here that goes green while proving nothing is exactly the failure this
# repository is built to avoid, so each one states plainly what it did not do.
# ────────────────────────────────────────────────────────────────────────────

name: Heavy suites

on:
  workflow_dispatch:
  schedule:
    # Sundays, 03:00 UTC. Nothing depends on the hour; it is off the weekday
    # queue so a scheduled run never competes with a pull request for a runner.
    - cron: "0 3 * * 0"
  push:
    tags:
      - "v*"

concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  losslessness:
    name: Losslessness suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm

      - name: Run the suite, or report that it does not exist yet
        shell: pwsh
        run: |
          $scripts = (Get-Content package.json -Raw | ConvertFrom-Json).scripts
          if ($scripts.PSObject.Properties.Name -contains "test:lossless") {
            pnpm run test:lossless
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Add-Content $env:GITHUB_STEP_SUMMARY "- Losslessness suite: **passed**"
            exit 0
          }

          # The corpus decision belongs to #45: generated with the bundled
          # FFmpeg at job start, or fetched from a release asset. Either way it
          # is never committed — CLAUDE.md section 20 rule 12. Whichever #45
          # chooses, it adds a `test:lossless` script and this branch stops
          # being taken.
          Write-Output "::warning::The losslessness suite does not exist yet (#45). This job proved nothing."
          Add-Content $env:GITHUB_STEP_SUMMARY "- Losslessness suite: **NOT IMPLEMENTED** — owned by #45 (Epic #6). This run proved nothing about output fidelity."

  timeline-benchmark:
    name: Timeline frame-rate benchmark
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm

      - name: Run the benchmark, or report that it does not exist yet
        shell: pwsh
        run: |
          $scripts = (Get-Content package.json -Raw | ConvertFrom-Json).scripts
          if ($scripts.PSObject.Properties.Name -contains "bench:timeline") {
            pnpm run bench:timeline
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Add-Content $env:GITHUB_STEP_SUMMARY "- Timeline benchmark: **passed**"
            exit 0
          }

          # CLAUDE.md section 12: 60 fps during drag, trim and zoom on a long
          # timeline, and an optimisation without a before-number is a guess.
          # #33 owns both the renderer and the measurement.
          Write-Output "::warning::The timeline benchmark does not exist yet (#33). This job proved nothing."
          Add-Content $env:GITHUB_STEP_SUMMARY "- Timeline benchmark: **NOT IMPLEMENTED** — owned by #33 (Epic #5). This run proved nothing about frame rate."

  engine-benchmarks:
    name: Engine timing benchmarks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          target-cache: debug
      - uses: ./.github/actions/fetch-sidecar

      # Timing assertions do not belong in the pull-request gate: a shared
      # runner under load makes them flaky, and a flaky gate gets bypassed.
      # They run here, where a failure blocks a release and gets looked at.
      #
      # #22: background work yields to interactive work — an interactive 1080p
      # decode does not queue behind, and stays within 35 percent of its idle
      # time while, far more background packet-enumeration jobs than there are
      # slots are queued against a two-hour file.
      - name: Background work yields to interactive decode (#22)
        run: cargo test -p blinkify-engine --test orchestrator -- --ignored background_work_yields_to_interactive_decode --nocapture

      # #26: a 4K long-GOP source with a proxy scrubs smoothly, and without one
      # does not — median seek-and-decode of five scattered frames, proxy at
      # least 3x faster. Measured locally at 1.12 s versus 47 ms.
      - name: A proxy makes 4K scrubbable (#26)
        run: cargo test -p blinkify-engine --test proxy -- --ignored a_proxy_makes_a_4k_source_scrubbable --nocapture

      # #27: ten minutes of 1080p30 through the preview session at full rate —
      # more than 29 presented frames a second — with the working set flat to
      # within 64 MB. Real time by construction, so it cannot run on a PR.
      - name: Ten minutes of 1080p30 preview with stable memory (#27)
        run: cargo test -p blinkify-engine --test preview -- --ignored ten_minutes_of_1080p30_plays_at_full_rate_with_stable_memory --nocapture

      # #28: over ten minutes of playback against the audio clock, no frame
      # is chosen more than one frame behind the sound, and the clock ends
      # within a frame of the audio actually consumed.
      - name: A/V drift under a frame over ten minutes (#28)
        run: cargo test -p blinkify-engine --test playback -- --ignored av_drift_stays_under_a_frame_over_ten_minutes --nocapture
